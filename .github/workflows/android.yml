name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npm run sync

      # 선택 사항: 저장소 Secrets에 서명 키를 넣어 두면 그 키로 서명합니다.
      # 없으면 저장소에 있는 개인 설치용 키(android/keystore/sideload.jks)를 씁니다.
      - name: Use signing key from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            echo "Using sideload keystore from the repository"
          fi

      - name: Build APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION *= *'\([^']*\)'.*/\1/p" www/version.js)
          APK="EarllnCore-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      # main에 반영될 때만 휴대폰에서 바로 받을 수 있는 Release를 만듭니다
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: EarllnCore ${{ env.VERSION }} (빌드 ${{ github.run_number }})
          make_latest: true
          files: ${{ env.APK }}
          body: |
            휴대폰에서 아래 **${{ env.APK }}** 를 눌러 내려받고 설치하세요.
            이전 버전이 깔려 있으면 그대로 덮어 설치하면 되고, 기록은 유지됩니다.
            처음 설치할 때는 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.
