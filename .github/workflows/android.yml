name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npm run sync

      # 서명 키는 저장소에 암호화되어 있습니다. Secrets의 비밀번호로 풀어서 씁니다.
      - name: Decrypt signing key
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error::Secret ANDROID_SIGNING_PASSWORD is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in android/keystore/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:ANDROID_SIGNING_PASSWORD
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(sed -n "s/.*APP_VERSION *= *'\([^']*\)'.*/\1/p" www/version.js)
          APK="EarllnCore-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remove decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      # main에 반영될 때만 휴대폰에서 바로 받을 수 있는 Release를 만듭니다
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: EarllnCore ${{ env.VERSION }} (빌드 ${{ github.run_number }})
          make_latest: true
          files: ${{ env.APK }}
          body: |
            휴대폰에서 아래 **${{ env.APK }}** 를 눌러 내려받고 설치하세요.
            이전 버전이 깔려 있으면 그대로 덮어 설치하면 되고, 기록은 유지됩니다.
            처음 설치할 때는 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.
